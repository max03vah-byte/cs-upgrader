<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Case Opener • Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-1: #05070A;
            --bg-2: #0A0F17;
            --bg-3: #111827;
            --panel: rgba(17, 24, 39, 0.65);
            --panel-solid: #111827;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 204, 0, 0.4);
            --accent: #FFCC00;
            --accent-2: #F5A623;
            --accent-glow: rgba(255, 204, 0, 0.35);
            --text-main: #FFFFFF;
            --text-muted: #8B95A7;
            --win: #00E676;
            --win-glow: rgba(0, 230, 118, 0.3);
            --lose: #FF3B5C;
            --lose-glow: rgba(255, 59, 92, 0.3);
            --gold-gradient: linear-gradient(135deg, #FFE082 0%, #FFCC00 50%, #F5A623 100%);
            --glass: blur(20px) saturate(180%);
            
            --rar-common: #8B95A7;
            --rar-uncommon: #4B69FF;
            --rar-rare: #8847FF;
            --rar-epic: #D32CE6;
            --rar-legendary: #FFCC00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-1);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
            overflow: hidden;
            position: relative;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(255, 204, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(245, 166, 35, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0A0F17 0%, #05070A 100%);
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 204, 0, 0.03) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(245, 166, 35, 0.03) 0%, transparent 30%);
            pointer-events: none;
            animation: floatBg 20s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, -20px) scale(1.05); }
        }

        /* ЭКРАН ЗАГРУЗКИ */
        .loading-screen {
            position: fixed; inset: 0; background: var(--bg-1); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .load-logo { width: 80px; height: 80px; margin-bottom: 25px; filter: drop-shadow(0 0 20px var(--accent-glow)); }
        .load-logo path { fill: url(#goldGrad); }
        .load-title { font-size: 20px; font-weight: 900; letter-spacing: 6px; margin-bottom: 30px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .load-bar-container { width: 220px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; position: relative; }
        .load-bar { width: 40%; height: 100%; background: var(--gold-gradient); border-radius: 3px; animation: loadAnim 1.2s infinite ease-in-out; box-shadow: 0 0 15px var(--accent-glow); }
        @keyframes loadAnim { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }

        /* ШАПКА */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px;
            background: var(--panel);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            position: relative;
        }
        .logo-area { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; letter-spacing: 1px; }
        .logo-icon { 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        .balance-box {
            background: rgba(0,0,0,0.4);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-weight: 800;
            font-size: 13px;
            display: flex; align-items: center; gap: 6px;
        }
        .balance-box::before { content: '💎'; font-size: 14px; }
        .balance-box span { 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* КОНТЕНТ */
        .main-content { 
            flex: 1; overflow-y: auto; padding: 16px; 
            display: flex; flex-direction: column; align-items: center;
            position: relative; z-index: 1;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }
        .main-content::-webkit-scrollbar { width: 4px; }
        .main-content::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
        
        .tab-content { display: none; width: 100%; max-width: 500px; }
        .tab-content.active { display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* КЕЙСЫ */
        .case-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 14px; width: 100%; padding-bottom: 20px;
        }
        @media (min-width: 400px) { .case-grid { grid-template-columns: repeat(3, 1fr); } }

        .case-card {
            background: var(--panel);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; 
            text-align: center; cursor: pointer;
            position: relative; overflow: hidden;
            transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center;
        }
        .case-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05) 0%, transparent 100%);
            pointer-events: none;
        }
        .case-card:active { transform: scale(0.97); border-color: var(--border-hover); }
        .case-card:hover { border-color: var(--border-hover); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        
        .case-card .case-img {
            width: 80px; height: 80px; margin: 10px 0;
            font-size: 60px;
            display: flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
            transition: transform 0.3s;
        }
        .case-card:hover .case-img { transform: scale(1.1) rotate(-5deg); }
        
        .case-card .case-name { font-size: 13px; font-weight: 900; margin-bottom: 4px; }
        .case-card .case-price { 
            font-size: 16px; font-weight: 900; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        /* РУЛЕТКА */
        .roulette-container {
            width: 100%; height: 120px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-radius: 16px;
            position: relative; overflow: hidden;
            margin-bottom: 20px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .roulette-container::before {
            content: '';
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 2px; height: 100%;
            background: var(--gold-gradient);
            box-shadow: 0 0 20px var(--accent);
            z-index: 10;
        }
        .roulette-container::after {
            content: '';
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 14px solid var(--accent);
            filter: drop-shadow(0 0 10px var(--accent));
            z-index: 11;
        }
        .roulette-strip {
            display: flex; align-items: center; height: 100%;
            transition: transform 5s cubic-bezier(0.15, 0.85, 0.3, 1);
            will-change: transform;
        }
        .roulette-item {
            flex-shrink: 0;
            width: 100px; height: 100px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-right: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        .roulette-item .item-img {
            font-size: 36px; margin-bottom: 6px;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
        }
        .roulette-item .item-name {
            font-size: 9px; font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            width: 90%; text-align: center;
        }
        .roulette-item.rar-common { border-bottom: 3px solid var(--rar-common); }
        .roulette-item.rar-uncommon { border-bottom: 3px solid var(--rar-uncommon); }
        .roulette-item.rar-rare { border-bottom: 3px solid var(--rar-rare); }
        .roulette-item.rar-epic { border-bottom: 3px solid var(--rar-epic); }
        .roulette-item.rar-legendary { border-bottom: 3px solid var(--rar-legendary); box-shadow: inset 0 0 20px var(--accent-glow); }

        /* КНОПКИ */
        .controls { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 12px; }
        .btn-open {
            background: var(--gold-gradient);
            color: #000;
            width: 100%; padding: 18px; 
            border-radius: 14px; border: none;
            font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-open::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .btn-open:hover::before { left: 100%; }
        .btn-open:active { transform: scale(0.98); box-shadow: 0 2px 10px var(--accent-glow); }
        .btn-open:disabled { 
            background: #1F2937; color: #4B5563; 
            box-shadow: none; cursor: not-allowed;
            transform: none;
        }

        /* ИНВЕНТАРЬ */
        .grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 12px; width: 100%; padding-bottom: 20px;
        }
        @media (min-width: 400px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .item-card {
            background: var(--panel);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border: 1px solid var(--border);
            border-radius: 14px; padding: 12px; 
            text-align: center; cursor: pointer;
            position: relative; overflow: hidden; 
            display: flex; flex-direction: column;
            transition: all 0.2s ease;
        }
        .item-card:active { transform: scale(0.97); }
        
        .rar-common-border { border-bottom: 3px solid var(--rar-common); }
        .rar-uncommon-border { border-bottom: 3px solid var(--rar-uncommon); box-shadow: 0 4px 15px rgba(75, 105, 255, 0.2); }
        .rar-rare-border { border-bottom: 3px solid var(--rar-rare); box-shadow: 0 4px 15px rgba(136, 71, 255, 0.2); }
        .rar-epic-border { border-bottom: 3px solid var(--rar-epic); box-shadow: 0 4px 15px rgba(211, 44, 230, 0.2); }
        .rar-legendary-border { border-bottom: 3px solid var(--rar-legendary); box-shadow: 0 4px 20px var(--accent-glow); }
        
        .item-card .item-icon { font-size: 32px; margin-bottom: 6px; }
        .item-card .item-name { font-size: 11px; font-weight: 900; margin-bottom: 4px; color: var(--text-main); }
        .item-card .item-price { font-size: 11px; color: var(--win); font-weight: 900; }

        /* ПРОФИЛЬ */
        .profile-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; width: 100%; }
        .profile-btn { 
            background: var(--panel);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            color: #fff; 
            border: 1px solid var(--border); 
            padding: 15px; border-radius: 12px; 
            font-weight: 800; cursor: pointer; font-size: 14px;
            transition: all 0.2s;
        }
        .profile-btn:active { transform: scale(0.98); border-color: var(--border-hover); }

        .avatar-circle {
            width: 80px; height: 80px; 
            background: linear-gradient(135deg, #1F2937, #111827);
            border-radius: 50%; margin: 0 auto; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 40px;
            border: 2px solid var(--border);
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.1);
        }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
            background: var(--panel);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; 
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: var(--text-muted); font-size: 10px; font-weight: 700;
            gap: 3px; width: 25%; position: relative; cursor: pointer;
            transition: all 0.2s;
        }
        .nav-item.active { color: var(--accent); }
        .nav-item.active .nav-icon { 
            filter: drop-shadow(0 0 8px var(--accent-glow));
            transform: scale(1.15);
        }
        .nav-item.active::before {
            content: '';
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 30px; height: 3px;
            background: var(--gold-gradient);
            border-radius: 0 0 3px 3px;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .nav-icon { font-size: 20px; transition: all 0.2s; }

        /* МОДАЛКИ */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000; justify-content: center; align-items: center; 
            padding: 20px;
        }
        .modal.active { display: flex; animation: fadeIn 0.2s ease; }
        .modal-content { 
            background: var(--panel-solid);
            width: 100%; max-width: 400px; height: 80vh; 
            border-radius: 20px; border: 1px solid var(--border); 
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-header { 
            padding: 16px; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .modal-title { font-size: 15px; font-weight: 900; letter-spacing: 0.5px; }
        .close-modal { 
            background: none; border: none; color: var(--text-muted); 
            font-size: 24px; cursor: pointer; 
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .close-modal:hover { background: rgba(255,255,255,0.05); }
        .modal-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; }
        
        .modal-search {
            width: 100%; padding: 12px; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border);
            border-radius: 10px; color: var(--text-main); 
            font-size: 13px; margin-bottom: 12px; outline: none;
        }
        .modal-search:focus { border-color: var(--accent); }
        .modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }

        .promo-modal-content { max-width: 320px; padding: 24px; text-align: center; height: auto; }
        .promo-input { 
            width: 100%; padding: 14px; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            color: var(--accent); 
            font-size: 16px; font-weight: 900;
            text-align: center; margin-bottom: 14px; outline: none;
            letter-spacing: 2px;
        }
        .promo-btns { display: flex; gap: 10px; }
        .promo-btn { 
            flex: 1; padding: 14px; border-radius: 10px; 
            font-weight: 900; cursor: pointer; border: none; 
            font-size: 13px; text-transform: uppercase;
            transition: all 0.2s;
        }
        .promo-btn:active { transform: scale(0.97); }
        .btn-cancel { background: #1F2937; color: #fff; }
        .btn-apply { background: var(--gold-gradient); color: #000; box-shadow: 0 4px 15px var(--accent-glow); }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--panel-solid); 
            color: #fff; 
            padding: 14px 24px; 
            border-radius: 12px;
            font-weight: 700; 
            z-index: 2000; 
            display: none; 
            font-size: 13px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .toast.show { display: block; transform: translateX(-50%) translateY(0); }

        .hidden { display: none !important; }

        /* Окно выигрыша */
        .win-modal-content {
            max-width: 340px; height: auto; padding: 30px 20px; text-align: center;
            border: 2px solid var(--accent);
            box-shadow: 0 0 60px var(--accent-glow);
            background: linear-gradient(145deg, #111827, #0A0F17);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }
        .win-modal-content::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
        }
        .win-icon {
            font-size: 80px; margin-bottom: 15px;
            filter: drop-shadow(0 0 30px var(--accent));
            animation: popIn 0.5s ease;
        }
        @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .win-title {
            font-size: 14px; font-weight: 900; color: var(--accent);
            letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase;
        }
        .win-item-name {
            font-size: 20px; font-weight: 900; color: var(--text-main);
            margin-bottom: 6px;
        }
        .win-item-price {
            font-size: 16px; font-weight: 900; color: var(--win);
            margin-bottom: 20px;
        }

        /* Эффект частиц при выигрыше */
        .confetti {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div class="loading-screen" id="loadingScreen">
        <svg class="load-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFE082;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#FFCC00;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#F5A623;stop-opacity:1" />
                </linearGradient>
            </defs>
            <path d="M12 2L22 12L19 15L12 8L5 15L2 12L12 2Z" />
            <path d="M12 10L22 20L19 23L12 16L5 23L2 20L12 10Z" />
        </svg>
        <div class="load-title">CASE OPENER</div>
        <div class="load-bar-container">
            <div class="load-bar"></div>
        </div>
    </div>

    <!-- ШАПКА -->
    <div class="header">
        <div class="logo-area"><span class="logo-icon">≪</span> CASE OPENER</div>
        <div class="balance-box"><span id="balanceDisplay">1000 ₽</span></div>
    </div>

    <div class="main-content">
        <!-- ВКЛАДКА КЕЙСЫ -->
        <div id="tab-cases" class="tab-content active">
            <div class="case-grid" id="caseGrid"></div>
        </div>

        <!-- ВКЛАДКА ИНВЕНТАРЬ -->
        <div id="tab-inventory" class="tab-content">
            <div class="grid" id="invGrid"></div>
        </div>

        <!-- ВКЛАДКА ПРОФИЛЬ -->
        <div id="tab-profile" class="tab-content">
            <div style="text-align: center; margin-bottom: 24px; width: 100%;">
                <div class="avatar-circle">👤</div>
                <div style="font-size: 18px; font-weight: 900; margin-top: 12px;">Игрок</div>
                <div style="color: var(--text-muted); font-size: 12px; font-weight: 700; margin-top: 4px;" id="profileIdText">ID: #1337</div>
            </div>
            <div class="profile-actions">
                <button class="profile-btn" onclick="resetGame()" style="color: var(--lose);">⚠️ Сбросить прогресс</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РУЛЕТКИ -->
    <div class="modal" id="rouletteModal" style="z-index: 3000;">
        <div class="modal-content" style="height: auto; max-width: 600px; background: #0A0F17; border: 2px solid var(--border); padding: 20px;">
            <div class="roulette-container">
                <div class="roulette-strip" id="rouletteStrip"></div>
            </div>
            <div class="controls">
                <button class="btn-open" id="openCaseBtn" onclick="spinRoulette()">ОТКРЫТЬ КЕЙС</button>
                <button class="profile-btn" onclick="closeRoulette()" style="width: 100%;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ВЫИГРЫША -->
    <div class="modal" id="winModal" style="z-index: 4000;">
        <div class="modal-content win-modal-content">
            <div class="win-icon" id="winIcon">🎁</div>
            <div class="win-title">ВЫ ВЫИГРАЛИ</div>
            <div class="win-item-name" id="winItemName">Название</div>
            <div class="win-item-price" id="winItemPrice">0 ₽</div>
            <button class="btn-open" onclick="closeWinModal()">ЗАБРАТЬ</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('cases', this)">
            <div class="nav-icon">📦</div><div>Кейсы</div>
        </div>
        <div class="nav-item" onclick="switchTab('inventory', this)">
            <div class="nav-icon">🎒</div><div>Инвентарь</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <div class="nav-icon">👤</div><div>Профиль</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        let state = loadState();
        let currentCase = null;
        let isSpinning = false;

        // Настройка кейсов
        const CASES = [
            { id: 'starter', name: 'Стартовый', price: 50, icon: '📦', color: '#8B95A7', items: [
                { name: 'Обычный номер', icon: '📱', price: 20, rarity: 'common', weight: 60 },
                { name: 'Красивый номер', icon: '📞', price: 100, rarity: 'uncommon', weight: 30 },
                { name: 'VIP номер', icon: '💎', price: 500, rarity: 'rare', weight: 10 }
            ]},
            { id: 'silver', name: 'Серебряный', price: 200, icon: '🥈', color: '#4B69FF', items: [
                { name: 'Обычный номер', icon: '📱', price: 50, rarity: 'common', weight: 40 },
                { name: 'Красивый номер', icon: '📞', price: 200, rarity: 'uncommon', weight: 35 },
                { name: 'VIP номер', icon: '💎', price: 800, rarity: 'rare', weight: 20 },
                { name: 'Золотой номер', icon: '👑', price: 3000, rarity: 'epic', weight: 5 }
            ]},
            { id: 'gold', name: 'Золотой', price: 500, icon: '🥇', color: '#FFCC00', items: [
                { name: 'Красивый номер', icon: '📞', price: 200, rarity: 'uncommon', weight: 30 },
                { name: 'VIP номер', icon: '💎', price: 1000, rarity: 'rare', weight: 40 },
                { name: 'Золотой номер', icon: '👑', price: 5000, rarity: 'epic', weight: 25 },
                { name: 'Бриллиантовый', icon: '💠', price: 20000, rarity: 'legendary', weight: 5 }
            ]},
            { id: 'diamond', name: 'Бриллиантовый', price: 2000, icon: '💎', color: '#D32CE6', items: [
                { name: 'VIP номер', icon: '💎', price: 1000, rarity: 'rare', weight: 30 },
                { name: 'Золотой номер', icon: '👑', price: 5000, rarity: 'epic', weight: 45 },
                { name: 'Бриллиантовый', icon: '💠', price: 20000, rarity: 'legendary', weight: 20 },
                { name: 'Эксклюзив', icon: '🏆', price: 100000, rarity: 'legendary', weight: 5 }
            ]}
        ];

        function loadState() {
            const saved = localStorage.getItem('case_opener_v1');
            if (saved) { try { return JSON.parse(saved); } catch (e) {} }
            return { balance: 1000, inventory: [] };
        }

        function saveState() { localStorage.setItem('case_opener_v1', JSON.stringify(state)); }
        function formatMoney(amount) { return amount.toLocaleString('ru-RU') + ' ₽'; }
        function updateBalance() { document.getElementById('balanceDisplay').textContent = formatMoney(state.balance); }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function init() {
            updateBalance();
            renderCases();
            renderInventory();
            
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 1200);
        }

        // --- КЕЙСЫ ---
        function renderCases() {
            const grid = document.getElementById('caseGrid');
            grid.innerHTML = CASES.map(c => `
                <div class="case-card" onclick="openCase('${c.id}')">
                    <div class="case-img">${c.icon}</div>
                    <div class="case-name">${c.name}</div>
                    <div class="case-price">${formatMoney(c.price)}</div>
                </div>
            `).join('');
        }

        // --- ОТКРЫТИЕ КЕЙСА ---
        window.openCase = function(id) {
            const caseItem = CASES.find(c => c.id === id);
            if (!caseItem) return;
            
            if (state.balance < caseItem.price) {
                return showToast('Недостаточно средств!');
            }
            
            currentCase = caseItem;
            
            // Создаем длинную ленту для прокрутки
            const strip = document.getElementById('rouletteStrip');
            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0)';
            
            let itemsHtml = '';
            // Генерируем 50 случайных предметов для ленты
            for (let i = 0; i < 50; i++) {
                const item = getRandomItem(caseItem.items);
                itemsHtml += createRouletteItemHtml(item);
            }
            strip.innerHTML = itemsHtml;
            
            // Открываем модалку рулетки
            document.getElementById('rouletteModal').classList.add('active');
            document.getElementById('openCaseBtn').disabled = false;
        }

        window.closeRoulette = function() {
            if (isSpinning) return; // Нельзя закрыть во время крутки
            document.getElementById('rouletteModal').classList.remove('active');
            currentCase = null;
        }

        // Функция выбора предмета по весам
        function getRandomItem(items) {
            const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (let item of items) {
                if (random < item.weight) return item;
                random -= item.weight;
            }
            return items[0];
        }

        // Создание HTML элемента для ленты
        function createRouletteItemHtml(item) {
            return `
                <div class="roulette-item rar-${item.rarity}">
                    <div class="item-img">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                </div>
            `;
        }

        // --- ВРАЩЕНИЕ РУЛЕТКИ ---
        window.spinRoulette = function() {
            if (isSpinning) return;
            if (!currentCase) return;
            
            if (state.balance < currentCase.price) {
                return showToast('Недостаточно средств!');
            }
            
            isSpinning = true;
            document.getElementById('openCaseBtn').disabled = true;
            
            // Списываем деньги
            state.balance -= currentCase.price;
            saveState();
            updateBalance();
            
            const strip = document.getElementById('rouletteStrip');
            const items = strip.children;
            const itemWidth = 100; // Ширина одного элемента
            
            // Выбираем выигрышный предмет
            const winItem = getRandomItem(currentCase.items);
            
            // Ищем индекс элемента в ленте, который совпадает с выигрышным (чтобы визуально выпал именно он)
            // Возьмем случайный индекс из середины ленты (например, 40-45)
            let winIndex = 40 + Math.floor(Math.random() * 5);
            
            // Подменяем предмет в ленте на выигрышный, чтобы визуал совпал
            const itemElement = items[winIndex];
            if (itemElement) {
                itemElement.innerHTML = `
                    <div class="item-img">${winItem.icon}</div>
                    <div class="item-name">${winItem.name}</div>
                `;
                itemElement.className = `roulette-item rar-${winItem.rarity}`;
            }
            
            // Прокрутка
            // Нам нужно сместить ленту так, чтобы winIndex оказался по центру (на 50% ширины контейнера)
            // Контейнер: 100% ширины экрана, лента: 50 элементов * 100px
            // Центр: 50% контейнера
            const containerWidth = strip.parentElement.offsetWidth;
            const centerOffset = containerWidth / 2;
            
            // Позиция выигрышного элемента в пикселях
            const itemPosition = (winIndex * itemWidth) + (itemWidth / 2);
            
            // Итоговое смещение: нужно, чтобы itemPosition оказался по центру
            // Смещаем влево: -(itemPosition - centerOffset)
            // Но добавим небольшой рандом, чтобы не всегда идеально по центру было
            const randomOffset = (Math.random() * 60) - 30; // -30..30 px
            const translateX = -(itemPosition - centerOffset + randomOffset);
            
            // Применяем трансформацию с анимацией
            strip.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.3, 1)';
            strip.style.transform = `translateX(${translateX}px)`;
            
            // Через 5 секунд (после анимации) показываем результат
            setTimeout(() => {
                // Добавляем предмет в инвентарь
                state.inventory.push(winItem);
                saveState();
                
                // Показываем окно выигрыша
                showWinModal(winItem);
                
                isSpinning = false;
                document.getElementById('openCaseBtn').disabled = false;
            }, 5000);
        }

        // --- ОКНО ВЫИГРЫША ---
        function showWinModal(item) {
            document.getElementById('winIcon').textContent = item.icon;
            document.getElementById('winItemName').textContent = item.name;
            document.getElementById('winItemPrice').textContent = formatMoney(item.price);
            
            // Устанавливаем цвет в зависимости от редкости
            const winIcon = document.getElementById('winIcon');
            const winTitle = document.getElementById('winTitle');
            
            document.getElementById('winModal').classList.add('active');
            
            // Эффект вибрации (если поддерживается)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 200]);
            }
            
            // Частицы (простая анимация)
            createConfetti();
        }

        window.closeWinModal = function() {
            document.getElementById('winModal').classList.remove('active');
            document.getElementById('rouletteModal').classList.remove('active');
            renderInventory();
            currentCase = null;
        }

        // --- ИНВЕНТАРЬ ---
        function renderInventory() {
            const grid = document.getElementById('invGrid');
            
            if (state.inventory.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 20px; font-weight: 700;">Инвентарь пуст</div>';
                return;
            }
            
            grid.innerHTML = state.inventory.map((item, index) => `
                <div class="item-card rar-${item.rarity}-border" onclick="sellItem(${index})">
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${formatMoney(item.price)}</div>
                </div>
            `).join('');
        }

        // --- ПРОДАЖА ПРЕДМЕТА ---
        window.sellItem = function(index) {
            const item = state.inventory[index];
            if (!item) return;
            
            if (confirm(`Продать "${item.name}" за ${formatMoney(item.price)}?`)) {
                state.balance += item.price;
                state.inventory.splice(index, 1);
                saveState();
                updateBalance();
                renderInventory();
                showToast(`Продан ${item.name} за ${formatMoney(item.price)}`);
            }
        }

        // --- СБРОС ---
        window.resetGame = function() {
            if (confirm('Вы уверены, что хотите полностью сбросить прогресс?')) {
                localStorage.removeItem('case_opener_v1');
                location.reload();
            }
        }

        // --- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ---
        window.switchTab = function(tab, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('tab-' + tab).classList.add('active');
            el.classList.add('active');

            if (tab === 'inventory') renderInventory();
        }

        // --- ЧАСТИЦЫ ---
        function createConfetti() {
            const colors = ['#FFCC00', '#FFE082', '#F5A623', '#00E676', '#FF3B5C'];
            const container = document.createElement('div');
            container.className = 'confetti';
            document.body.appendChild(container);
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = '8px';
                particle.style.height = '8px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.borderRadius = '50%';
                particle.style.left = '50%';
                particle.style.top = '40%';
                particle.style.opacity = '0';
                particle.style.transform = `translate(-50%, -50%)`;
                container.appendChild(particle);
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 100 + Math.random() * 200;
                const dx = Math.cos(angle) * velocity;
                const dy = Math.sin(angle) * velocity;
                
                particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0, 0.5, 0.5, 1)'
                });
            }
            
            setTimeout(() => container.remove(), 2000);
        }

        // Запуск
        init();
    </script>
</body>
    </html>
