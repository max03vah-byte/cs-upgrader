<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Апгрейдер CS2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent: #ffd700;
            --accent-hover: #ffea00;
            --text-main: #ffffff;
            --text-muted: #888;
            --border: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            user-select: none;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--panel-bg);
            border-radius: 12px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .balance { font-size: 20px; font-weight: bold; color: var(--accent); }

        .main-zone {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 15px;
            margin-bottom: 15px;
        }

        .panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .panel-title { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; text-align: center; }
        
        .skin-card {
            width: 100%;
            background: #2a2a2a;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .skin-img {
            width: 100%;
            height: 80px;
            object-fit: contain;
            margin-bottom: 5px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }
        
        .item-name { font-size: 12px; font-weight: bold; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-price { font-size: 14px; color: var(--accent); font-weight: bold; }

        .wheel-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1.2;
        }
        .wheel {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) 0deg, var(--accent) 0deg, #333 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
            transition: background 0.1s;
        }
        .wheel-inner {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .chance-text { font-size: 22px; font-weight: bold; color: var(--accent); }
        .chance-label { font-size: 11px; color: var(--text-muted); }

        .btn-upgrade {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-upgrade:hover { background: var(--accent-hover); transform: scale(1.02); }
        .btn-upgrade:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }

        .input-group {
            margin-top: 10px;
            width: 100%;
        }
        .input-group input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
        }
        .input-group input:focus { outline: none; border-color: var(--accent); }

        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
            font-size: 14px;
        }
        .result.win { background: rgba(0, 255, 0, 0.1); border: 1px solid #00ff00; color: #00ff00; }
        .result.lose { background: rgba(255, 0, 0, 0.1); border: 1px solid #ff0000; color: #ff0000; }

        .inventory {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border);
            flex-grow: 1;
        }
        .inv-title { font-size: 15px; color: var(--text-muted); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; position: sticky; top: 0; background: var(--panel-bg); z-index: 10; }
        
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .inv-grid::-webkit-scrollbar { width: 8px; }
        .inv-grid::-webkit-scrollbar-track { background: var(--bg-color); border-radius: 10px; }
        .inv-grid::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        
        .inv-item {
            background: #252525;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 1px solid #444;
            cursor: pointer;
            transition: all 0.2s;
        }
        .inv-item:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.1); }
        .inv-item .skin-img { height: 60px; }
        
        @media (max-width: 600px) {
            .main-zone { flex-direction: column; }
            .wheel-zone { flex-direction: row; justify-content: space-around; }
            .wheel { width: 100px; height: 100px; margin-bottom: 0; }
            .wheel-inner { width: 75px; height: 75px; }
            .chance-text { font-size: 16px; }
            .inv-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); max-height: 300px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>Баланс</div>
        <div class="balance" id="balance">0</div>
        <button id="resetBtn" style="background:none; border:1px solid #555; color:#888; padding:5px 10px; border-radius:5px; cursor:pointer;">Сброс</button>
    </div>

    <div class="main-zone">
        <div class="panel">
            <div class="panel-title">Ваша ставка</div>
            <div class="skin-card">
                <div style="font-size: 40px; margin-bottom: 5px;">💵</div>
                <div class="item-name">Виртуальные деньги</div>
                <div class="input-group">
                    <input type="number" id="betInput" placeholder="Сумма" min="1">
                </div>
            </div>
        </div>

        <div class="wheel-zone">
            <div class="wheel" id="wheel">
                <div class="wheel-inner">
                    <div class="chance-text" id="chanceText">0%</div>
                    <div class="chance-label">Шанс</div>
                </div>
            </div>
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <button class="btn-upgrade" id="upgradeBtn">Улучшить</button>
                <div class="result" id="resultBox"></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Цель апгрейда</div>
            <div class="skin-card selected" id="targetCard">
                <img src="" id="targetImg" class="skin-img">
                <div class="item-name" id="targetName"></div>
                <div class="item-price" id="targetPrice"></div>
            </div>
        </div>
    </div>

    <div class="inventory">
        <div class="inv-title">Выберите скин для апгрейда (50 шт.)</div>
        <div class="inv-grid" id="invGrid"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const ITEMS = [
            { id: '1', name: 'P250 | Sand Dune', price: 10, img: 'https://csgostash.com/img/skins/233.png' },
            { id: '2', name: 'Glock-18 | Candy Apple', price: 20, img: 'https://csgostash.com/img/skins/135.png' },
            { id: '3', name: 'USP-S | Forest Leaves', price: 30, img: 'https://csgostash.com/img/skins/243.png' },
            { id: '4', name: 'AK-47 | Safari Mesh', price: 50, img: 'https://csgostash.com/img/skins/27.png' },
            { id: '5', name: 'M4A4 | Urban DDPAT', price: 60, img: 'https://csgostash.com/img/skins/178.png' },
            { id: '6', name: 'AWP | Safari Mesh', price: 80, img: 'https://csgostash.com/img/skins/8.png' },
            { id: '7', name: 'Desert Eagle | Mudder', price: 100, img: 'https://csgostash.com/img/skins/72.png' },
            { id: '8', name: 'AK-47 | Slate', price: 120, img: 'https://csgostash.com/img/skins/1042.png' },
            { id: '9', name: 'USP-S | Ticket to Hell', price: 150, img: 'https://csgostash.com/img/skins/1189.png' },
            { id: '10', name: 'Glock-18 | Water Elemental', price: 180, img: 'https://csgostash.com/img/skins/350.png' },
            { id: '11', name: 'M4A1-S | Cyrex', price: 200, img: 'https://csgostash.com/img/skins/311.png' },
            { id: '12', name: 'AWP | Worm God', price: 220, img: 'https://csgostash.com/img/skins/424.png' },
            { id: '13', name: 'AK-47 | Blue Laminate', price: 250, img: 'https://csgostash.com/img/skins/281.png' },
            { id: '14', name: 'M4A4 | Evil Daimyo', price: 280, img: 'https://csgostash.com/img/skins/471.png' },
            { id: '15', name: 'Desert Eagle | Crimson Web', price: 300, img: 'https://csgostash.com/img/skins/96.png' },
            { id: '16', name: 'AWP | Electric Hive', price: 350, img: 'https://csgostash.com/img/skins/346.png' },
            { id: '17', name: 'AK-47 | Redline', price: 400, img: 'https://csgostash.com/img/skins/316.png' },
            { id: '18', name: 'USP-S | Cyrex', price: 450, img: 'https://csgostash.com/img/skins/365.png' },
            { id: '19', name: 'M4A1-S | Guardian', price: 500, img: 'https://csgostash.com/img/skins/305.png' },
            { id: '20', name: 'Desert Eagle | Code Red', price: 600, img: 'https://csgostash.com/img/skins/622.png' },
            { id: '21', name: 'AWP | Neo-Noir', price: 700, img: 'https://csgostash.com/img/skins/582.png' },
            { id: '22', name: 'AK-47 | Point Disarray', price: 800, img: 'https://csgostash.com/img/skins/540.png' },
            { id: '23', name: 'M4A1-S | Printstream', price: 1000, img: 'https://csgostash.com/img/skins/982.png' },
            { id: '24', name: 'USP-S | Neo-Noir', price: 1100, img: 'https://csgostash.com/img/skins/587.png' },
            { id: '25', name: 'AK-47 | Bloodsport', price: 1200, img: 'https://csgostash.com/img/skins/623.png' },
            { id: '26', name: 'AWP | Asiimov', price: 1500, img: 'https://csgostash.com/img/skins/331.png' },
            { id: '27', name: 'M4A4 | Desolate Space', price: 1600, img: 'https://csgostash.com/img/skins/677.png' },
            { id: '28', name: 'AK-47 | The Empress', price: 1800, img: 'https://csgostash.com/img/skins/688.png' },
            { id: '29', name: 'Desert Eagle | Printstream', price: 2000, img: 'https://csgostash.com/img/skins/981.png' },
            { id: '30', name: 'USP-S | Kill Confirmed', price: 2200, img: 'https://csgostash.com/img/skins/433.png' },
            { id: '31', name: 'M4A4 | The Emperor', price: 2500, img: 'https://csgostash.com/img/skins/687.png' },
            { id: '32', name: 'AK-47 | Vulcan', price: 2800, img: 'https://csgostash.com/img/skins/364.png' },
            { id: '33', name: 'AWP | Hyper Beast', price: 3000, img: 'https://csgostash.com/img/skins/460.png' },
            { id: '34', name: 'M4A1-S | Hyper Beast', price: 3500, img: 'https://csgostash.com/img/skins/461.png' },
            { id: '35', name: 'AK-47 | Neon Revolution', price: 4000, img: 'https://csgostash.com/img/skins/555.png' },
            { id: '36', name: 'AWP | Wildfire', price: 4500, img: 'https://csgostash.com/img/skins/520.png' },
            { id: '37', name: 'AK-47 | Case Hardened', price: 5000, img: 'https://csgostash.com/img/skins/287.png' },
            { id: '38', name: 'Desert Eagle | Blaze', price: 5500, img: 'https://csgostash.com/img/skins/68.png' },
            { id: '39', name: 'AWP | Containment Breach', price: 6000, img: 'https://csgostash.com/img/skins/811.png' },
            { id: '40', name: 'AK-47 | Fire Serpent', price: 7000, img: 'https://csgostash.com/img/skins/302.png' },
            { id: '41', name: 'AWP | Medusa', price: 8000, img: 'https://csgostash.com/img/skins/500.png' },
            { id: '42', name: 'M4A4 | Poseidon', price: 9000, img: 'https://csgostash.com/img/skins/279.png' },
            { id: '43', name: 'AWP | Dragon Lore', price: 10000, img: 'https://csgostash.com/img/skins/144.png' },
            { id: '44', name: 'M4A4 | Howl', price: 12000, img: 'https://csgostash.com/img/skins/256.png' },
            { id: '45', name: 'AWP | Gungnir', price: 15000, img: 'https://csgostash.com/img/skins/769.png' },
            { id: '46', name: 'AK-47 | Wild Lotus', price: 18000, img: 'https://csgostash.com/img/skins/789.png' },
            { id: '47', name: 'AWP | The Prince', price: 20000, img: 'https://csgostash.com/img/skins/788.png' },
            { id: '48', name: '★ Karambit | Doppler', price: 25000, img: 'https://csgostash.com/img/skins/626.png' },
            { id: '49', name: '★ Butterfly Knife | Fade', price: 30000, img: 'https://csgostash.com/img/skins/429.png' },
            { id: '50', name: '★ M9 Bayonet | Crimson Web', price: 35000, img: 'https://csgostash.com/img/skins/382.png' }
        ];

        const STORAGE_KEY = 'cs_upgrader_state_v7';
        const DEFAULT_BALANCE = 1000;
        
        let state = loadState();
        let selectedTarget = ITEMS[16]; // По умолчанию AK Redline

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) { try { return JSON.parse(saved); } catch (e) {} }
            return { balance: DEFAULT_BALANCE };
        }

        function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        function updateBalance() { document.getElementById('balance').textContent = state.balance.toLocaleString(); }

        function renderGrid() {
            const grid = document.getElementById('invGrid');
            grid.innerHTML = ITEMS.map(item => `
                <div class="inv-item" onclick="selectTarget('${item.id}')">
                    <img src="${item.img}" class="skin-img" loading="lazy" onerror="this.style.opacity='0'">
                    <div class="item-name" title="${item.name}">${item.name}</div>
                    <div class="item-price">$${item.price}</div>
                </div>
            `).join('');
        }

        window.selectTarget = function(id) {
            selectedTarget = ITEMS.find(i => i.id === id);
            
            document.getElementById('targetName').textContent = selectedTarget.name;
            document.getElementById('targetPrice').textContent = '$' + selectedTarget.price;
            document.getElementById('targetImg').src = selectedTarget.img;
            
            updateChanceUI();
            document.getElementById('resultBox').style.display = 'none';
        }

        function updateChanceUI() {
            const bet = parseInt(document.getElementById('betInput').value) || 0;
            let chance = bet / selectedTarget.price;
            if (chance > 1) chance = 1;
            if (chance < 0) chance = 0;
            
            const percent = (chance * 100).toFixed(1);
            document.getElementById('chanceText').textContent = percent + '%';
            
            const wheel = document.getElementById('wheel');
            const degrees = chance * 360;
            wheel.style.background = `conic-gradient(var(--accent) ${degrees}deg, #333 ${degrees}deg)`;
        }

        document.getElementById('betInput').addEventListener('input', updateChanceUI);

        document.getElementById('upgradeBtn').addEventListener('click', () => {
            const bet = parseInt(document.getElementById('betInput').value);
            if (!bet || bet <= 0) return showResult('Введите сумму', false);
            if (bet > state.balance) return showResult('Недостаточно средств', false);
            if (bet > selectedTarget.price) return showResult('Ставка больше цены цели', false);

            const chance = bet / selectedTarget.price;
            state.balance -= bet;
            
            const wheel = document.getElementById('wheel');
            let currentDeg = 0;
            const spinInterval = setInterval(() => {
                currentDeg += 25;
                wheel.style.background = `conic-gradient(var(--accent) ${currentDeg}deg, #333 ${currentDeg}deg)`;
            }, 20);

            setTimeout(() => {
                clearInterval(spinInterval);
                
                const win = Math.random() < chance;
                if (win) {
                    state.balance += selectedTarget.price;
                    showResult(`🎉 Выигрыш! Получен ${selectedTarget.name}`, true);
                } else {
                    showResult(`💀 Не повезло. Потеряно $${bet}`, false);
                }
                
                saveState();
                updateBalance();
                updateChanceUI();
                document.getElementById('betInput').value = '';
                
            }, 1000);
        });

        function showResult(text, isWin) {
            const box = document.getElementById('resultBox');
            box.style.display = 'block';
            box.className = 'result ' + (isWin ? 'win' : 'lose');
            box.textContent = text;
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Сбросить весь прогресс?')) {
                state = { balance: DEFAULT_BALANCE };
                saveState();
                updateBalance();
                document.getElementById('betInput').value = '';
                updateChanceUI();
                document.getElementById('resultBox').style.display = 'none';
            }
        });

        // Инициализация
        updateBalance();
        renderGrid();
        selectTarget('17'); // AK Redline
    </script>
</body>
</html>
