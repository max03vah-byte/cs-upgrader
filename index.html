<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Апгрейдер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0f14;
            --panel-bg: #161a23;
            --accent: #ffd700;
            --text-main: #ffffff;
            --text-muted: #888;
            --border: #2a2f3a;
            --win: #2ecc71;
            --lose: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px; /* Место под нижнее меню */
            user-select: none;
            overflow: hidden;
        }
        
        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--panel-bg);
            border-bottom: 2px solid var(--accent);
            position: relative;
            z-index: 100;
        }
        .balance { font-size: 18px; font-weight: bold; color: var(--accent); }

        /* Контент */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            position: relative;
        }
        .content-section { display: none; }
        .content-section.active { display: flex; flex-direction: column; height: 100%; }

        /* --- АПГРЕЙДЕР --- */
        .upgrader-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .circle-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 10px 0;
            height: 180px;
        }
        
        .wheel {
            width: 180px; height: 180px; border-radius: 50%;
            background: conic-gradient(var(--accent) 0deg, var(--accent) 0deg, #222 0deg);
            display: flex; align-items: center; justify-content: center;
            position: relative; transition: background 0.1s;
            border: 4px solid #333;
        }
        .wheel-inner {
            width: 150px; height: 150px; border-radius: 50%;
            background: var(--bg-color); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            border: 2px solid #333;
        }
        .chance-text { font-size: 28px; font-weight: bold; color: var(--accent); }
        .chance-label { font-size: 12px; color: var(--text-muted); }

        /* Стрелка сверху */
        .arrow-pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            color: var(--accent);
            z-index: 10;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.8));
        }
        
        .up-panels {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }
        .up-panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
            min-height: 120px;
        }
        .up-panel-title { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; width: 100%; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        
        .skin-img {
            width: 100%;
            height: 50px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        .item-name { font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .item-price { font-size: 13px; color: var(--accent); font-weight: bold; }

        .quick-btns {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; width: 100%;
        }
        .quick-btn {
            background: #222; color: #fff; border: 1px solid #444; padding: 6px;
            border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold;
        }
        .quick-btn:hover { background: var(--accent); color: #000; }

        .btn-upgrade {
            background: var(--accent); color: #000; border: none; padding: 15px;
            font-size: 18px; font-weight: 900; border-radius: 10px; cursor: pointer;
            text-transform: uppercase; width: 100%; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        .btn-upgrade:hover { background: #ffea00; }

        .result {
            margin-top: 10px; padding: 10px; border-radius: 8px; text-align: center;
            font-weight: bold; display: none; font-size: 14px; width: 100%;
        }
        .result.win { background: rgba(46, 204, 113, 0.1); border: 1px solid var(--win); color: var(--win); }
        .result.lose { background: rgba(231, 76, 60, 0.1); border: 1px solid var(--lose); color: var(--lose); }

        /* Инвентарь внизу */
        .inv-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid var(--border);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .inv-title { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            overflow-y: auto;
            flex: 1;
        }
        .inv-grid::-webkit-scrollbar { width: 5px; }
        .inv-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
        .inv-item {
            background: #1e232e;
            border-radius: 8px;
            padding: 5px;
            text-align: center;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .inv-item:hover { border-color: var(--accent); }
        .inv-item .skin-img { height: 40px; }
        .inv-item .item-name { font-size: 10px; }
        .inv-item .item-price { font-size: 11px; }

        /* --- МАГАЗИН --- */
        .shop-controls {
            display: flex; gap: 10px; margin-bottom: 10px;
        }
        .shop-controls input, .shop-controls select {
            flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--panel-bg); color: #fff; outline: none; font-size: 14px;
        }
        .shop-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px; padding-bottom: 20px;
        }
        .shop-item {
            background: var(--panel-bg); border-radius: 10px; padding: 10px;
            border: 1px solid var(--border); text-align: center; display: flex; flex-direction: column;
        }
        .shop-item .skin-img { height: 60px; }
        .btn-buy {
            background: var(--accent); color: #000; border: none; padding: 6px;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto;
            transition: 0.2s; font-size: 12px;
        }
        .btn-buy:hover { background: #ffea00; }

        /* --- ПРОФИЛЬ --- */
        .profile-card {
            background: var(--panel-bg); border-radius: 16px; padding: 20px;
            border: 1px solid var(--border); text-align: center;
        }
        .avatar { font-size: 60px; margin-bottom: 10px; }
        .profile-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;
        }
        .stat-box {
            background: #1e232e; border-radius: 10px; padding: 15px; border: 1px solid var(--border);
        }
        .stat-val { font-size: 18px; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--panel-bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-muted); cursor: pointer; font-size: 10px; gap: 4px;
        }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; }

        @media (max-width: 400px) {
            .wheel { width: 140px; height: 140px; }
            .wheel-inner { width: 110px; height: 110px; }
            .chance-text { font-size: 20px; }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <div style="font-weight: bold; font-size: 16px;">CS2 UPGRADER</div>
        <div class="balance" id="balanceDisplay">0 ₽</div>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        
        <!-- ВКЛАДКА АПГРЕЙД -->
        <div id="section-upgrader" class="content-section active">
            <div class="upgrader-layout">
                <!-- Колесо -->
                <div class="circle-zone">
                    <div class="arrow-pointer" id="arrow">▼</div>
                    <div class="wheel" id="wheel">
                        <div class="wheel-inner">
                            <div class="chance-text" id="chanceText">0%</div>
                            <div class="chance-label">Шанс</div>
                        </div>
                    </div>
                </div>

                <!-- Панели ставки и цели -->
                <div class="up-panels">
                    <div class="up-panel">
                        <div class="up-panel-title">ВАША СТАВКА</div>
                        <img src="" id="leftImg" class="skin-img" style="display:none;">
                        <div id="leftEmpty" style="color:var(--text-muted); font-size:30px; margin-top:10px;">📦</div>
                        <div class="item-name" id="leftName">Выберите скин</div>
                        <div class="item-price" id="leftPrice"></div>
                    </div>
                    
                    <div style="display: flex; align-items: center; color: var(--text-muted);">→</div>

                    <div class="up-panel">
                        <div class="up-panel-title">ЦЕЛЬ</div>
                        <img src="" id="rightImg" class="skin-img">
                        <div class="item-name" id="rightName"></div>
                        <div class="item-price" id="rightPrice"></div>
                    </div>
                </div>

                <!-- Кнопки шанса -->
                <div class="quick-btns">
                    <button class="quick-btn" onclick="setQuickTarget('x2')">x2</button>
                    <button class="quick-btn" onclick="setQuickTarget('x4')">x4</button>
                    <button class="quick-btn" onclick="setQuickTarget('x8')">x8</button>
                    <button class="quick-btn" onclick="setQuickTarget('35')">35%</button>
                    <button class="quick-btn" onclick="setQuickTarget('55')">55%</button>
                    <button class="quick-btn" onclick="setQuickTarget('75')">75%</button>
                </div>

                <button class="btn-upgrade" id="upgradeBtn" style="margin-top: 10px;">УЛУЧШИТЬ</button>
                <div class="result" id="resultBox"></div>

                <!-- Инвентарь на главной -->
                <div class="inv-panel">
                    <div class="inv-title">ВЫБЕРИТЕ СКИНЫ ДЛЯ СТАВКИ</div>
                    <div class="inv-grid" id="mainInvGrid"></div>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА МАГАЗИН -->
        <div id="section-shop" class="content-section">
            <div class="shop-controls">
                <input type="text" id="searchInput" placeholder="Поиск по названию..." oninput="renderShop()">
                <select id="sortSelect" onchange="renderShop()">
                    <option value="asc">По цене (дешевле)</option>
                    <option value="desc">По цене (дороже)</option>
                </select>
            </div>
            <div class="shop-grid" id="shopGrid"></div>
        </div>

        <!-- ВКЛАДКА ПРОФИЛЬ -->
        <div id="section-profile" class="content-section">
            <div class="profile-card">
                <div class="avatar">👤</div>
                <div class="profile-name">Мой Профиль</div>
                <div style="color: var(--text-muted); font-size: 14px;">ID: #1337</div>
                
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-val" id="statBalance">0 ₽</div>
                        <div class="stat-label">Баланс</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="statBestDrop">0 ₽</div>
                        <div class="stat-label">Лучший дроп</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="statUpgrades">0</div>
                        <div class="stat-label">Апгрейдов</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="statInvCount">0</div>
                        <div class="stat-label">Скинов в инв.</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('section-upgrader', this)">
            <div class="nav-icon">⚡</div>
            <div>Апгрейд</div>
        </div>
        <div class="nav-item" onclick="switchTab('section-shop', this)">
            <div class="nav-icon">🛒</div>
            <div>Магазин</div>
        </div>
        <div class="nav-item" onclick="switchTab('section-profile', this)">
            <div class="nav-icon">👤</div>
            <div>Профиль</div>
        </div>
    </div>

            { id: '47', name: 'AWP | The Prince', price: 20000, img: 'https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRv38xsLEzklFjzpC7YX6FA58z_2bcjWl7t_hbwWJvFAE' },
            { id: '48', name: '★ Karambit | Doppler', price: 25000, img: 'https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRv38xsLEzklFjzpC7YX6FA58z_2bcjWl7t_hbwWJvFAE' },
            { id: '49', name: '★ Butterfly Knife | Fade', price: 30000, img: 'https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRv38xsLEzklFjzpC7YX6FA58z_2bcjWl7t_hbwWJvFAE' },
            { id: '50', name: '★ M9 Bayonet | Crimson Web', price: 35000, img: 'https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRv38xsLEzklFjzpC7YX6FA58z_2bcjWl7t_hbwWJvFAE' }
        ];

        const STORAGE_KEY = 'cs_upgrader_v10';
        let state = loadState();
        let selectedLeft = null; // Скин для ставки
        let selectedRight = ITEMS[16]; // Цель (по умолчанию AK Redline)
        let upgradeCounter = 0; // Счетчик для секретного шанса

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) { 
                try { 
                    const parsed = JSON.parse(saved); 
                    if (!parsed.bestDrop) parsed.bestDrop = 0;
                    if (!parsed.upgradesCount) parsed.upgradesCount = 0;
                    return parsed; 
                } catch (e) {} 
            }
            return { balance: 1000, inventory: [], bestDrop: 0, upgradesCount: 0 };
        }

        function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        
        function updateUI() {
            document.getElementById('balanceDisplay').textContent = state.balance.toLocaleString() + ' ₽';
            document.getElementById('statBalance').textContent = state.balance.toLocaleString() + ' ₽';
            document.getElementById('statBestDrop').textContent = state.bestDrop.toLocaleString() + ' ₽';
            document.getElementById('statUpgrades').textContent = state.upgradesCount;
            document.getElementById('statInvCount').textContent = state.inventory.length;
        }

        // Вкладки
        window.switchTab = function(tabId, el) {
            document.querySelectorAll('.content-section').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
            
            if (tabId === 'section-shop') renderShop();
            if (tabId === 'section-upgrader') renderMainInventory();
        }

        // Отрисовка Магазина
        window.renderShop = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            const grid = document.getElementById('shopGrid');
            
            let filtered = ITEMS.filter(i => i.name.toLowerCase().includes(query));
            
            if (sort === 'asc') filtered.sort((a, b) => a.price - b.price);
            else if (sort === 'desc') filtered.sort((a, b) => b.price - a.price);
            
            grid.innerHTML = filtered.map(item => `
                <div class="shop-item">
                    <img src="${item.img}" class="skin-img" loading="lazy" onerror="this.src='https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRv38xsLEzklFjzpC7YX6FA58z_2bcjWl7t_hbwWJvFAE'">
                    <div class="item-name" title="${item.name}">${item.name}</div>
                    <div class="item-price">${item.price.toLocaleString()} ₽</div>
                    <button class="btn-buy" onclick="buyItem('${item.id}')">Купить</button>
                </div>
            `).join('');
        }

        window.buyItem = function(id) {
            const item = ITEMS.find(i => i.id === id);
            if (state.balance < item.price) return alert('Недостаточно средств!');
            state.balance -= item.price;
            state.inventory.push(item);
            saveState();
            updateUI();
        }

        // Отрисовка Инвентаря на главной
        function renderMainInventory() {
            const grid = document.getElementById('mainInvGrid');
            if (state.inventory.length === 0) {
                grid.innerHTML = '<div style="color:var(--text-muted); font-size:12px; grid-column: 1/-1; text-align:center;">Инвентарь пуст</div>';
                return;
            }
            grid.innerHTML = state.inventory.map((item, index) => `
                <div class="inv-item" onclick="selectLeftItem(${index})">
                    <img src="${item.img}" class="skin-img" loading="lazy">
                    <div class="item-name">${item.name.split('|')[0]}</div>
                    <div class="item-price">${item.price} ₽</div>
                </div>
            `).join('');
        }

        // Выбор скина для апгрейда
        window.selectLeftItem = function(index) {
            selectedLeft = state.inventory[index];
            selectedLeft.index = index;
            
            document.getElementById('leftImg').src = selectedLeft.img;
            document.getElementById('leftImg').style.display = 'block';
            document.getElementById('leftEmpty').style.display = 'none';
            document.getElementById('leftName').textContent = selectedLeft.name;
            document.getElementById('leftPrice').textContent = selectedLeft.price.toLocaleString() + ' ₽';
            
            updateChanceUI();
        }

        window.selectTarget = function(id) {
            selectedRight = ITEMS.find(i => i.id === id);
            document.getElementById('rightName').textContent = selectedRight.name;
            document.getElementById('rightPrice').textContent = selectedRight.price.toLocaleString() + ' ₽';
            document.getElementById('rightImg').src = selectedRight.img;
            updateChanceUI();
        }

        window.setQuickTarget = function(mode) {
            if (!selectedLeft) return alert('Сначала выберите скин из инвентаря!');
            
            let targetPrice;
            if (mode === 'x2') targetPrice = selectedLeft.price * 2;
            else if (mode === 'x4') targetPrice = selectedLeft.price * 4;
            else if (mode === 'x8') targetPrice = selectedLeft.price * 8;
            else if (mode === '35') targetPrice = selectedLeft.price / 0.35;
            else if (mode === '55') targetPrice = selectedLeft.price / 0.55;
            else if (mode === '75') targetPrice = selectedLeft.price / 0.75;

            let closest = ITEMS[0];
            let minDiff = Infinity;
            for (let item of ITEMS) {
                const diff = Math.abs(item.price - targetPrice);
                if (diff < minDiff) { minDiff = diff; closest = item; }
            }
            selectTarget(closest.id);
        }

        function updateChanceUI() {
            if (!selectedLeft) {
                document.getElementById('chanceText').textContent = '0%';
                document.getElementById('wheel').style.background = `conic-gradient(var(--accent) 0deg, #222 0deg)`;
                return;
            }
            let chance = selectedLeft.price / selectedRight.price;
            if (chance > 1) chance = 1;
            const percent = (chance * 100).toFixed(1);
            document.getElementById('chanceText').textContent = percent + '%';
            document.getElementById('wheel').style.background = `conic-gradient(var(--accent) ${chance * 360}deg, #222 ${chance * 360}deg)`;
        }

        // Логика Апгрейда
        document.getElementById('upgradeBtn').addEventListener('click', () => {
            if (!selectedLeft) return alert('Выберите скин из инвентаря!');
            if (selectedLeft.price >= selectedRight.price) return alert('Цена цели должна быть выше!');

            const chance = selectedLeft.price / selectedRight.price;
            let targetToWin = selectedRight;
            
            // Секретный шанс каждый 15-й апгрейд
            upgradeCounter++;
            let secretDrop = false;
            if (upgradeCounter >= 15) {
                upgradeCounter = 0;
                if (Math.random() < 0.3) { // 30% шанс на секретный дроп
                    secretDrop = true;
                    targetToWin = ITEMS[43]; // AWP Dragon Lore
                    if (selectedLeft.price > 5000) targetToWin = ITEMS[47]; // AWP The Prince
                }
            }

            // Удаляем скин
            state.inventory.splice(selectedLeft.index, 1);
            
            // Анимация колеса
            const wheel = document.getElementById('wheel');
            let currentDeg = 0;
            const spinInterval = setInterval(() => {
                currentDeg += 30;
                wheel.style.background = `conic-gradient(var(--accent) ${currentDeg}deg, #222 ${currentDeg}deg)`;
            }, 30);

            setTimeout(() => {
                clearInterval(spinInterval);
                
                const win = secretDrop || (Math.random() < chance);
                const box = document.getElementById('resultBox');
                
                if (win) {
                    state.inventory.push(targetToWin);
                    state.upgradesCount++;
                    if (targetToWin.price > state.bestDrop) state.bestDrop = targetToWin.price;
                    
                    box.className = 'result win';
                    box.textContent = `🎉 Выигрыш! ${targetToWin.name}`;
                } else {
                    state.upgradesCount++;
                    box.className = 'result lose';
                    box.textContent = `💀 Не повезло. Скин сгорел.`;
                }
                box.style.display = 'block';
                
                saveState();
                renderMainInventory();
                updateUI();
                
                selectedLeft = null;
                document.getElementById('leftImg').style.display = 'none';
                document.getElementById('leftEmpty').style.display = 'block';
                document.getElementById('leftName').textContent = 'Выберите скин';
                document.getElementById('leftPrice').textContent = '';
                updateChanceUI();
                
            }, 1000);
        });

        // Инициализация
        updateUI();
        selectTarget('17'); // AK Redline
        renderMainInventory();
        
    </script>
