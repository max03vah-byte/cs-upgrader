<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Апгрейдер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0f14;
            --panel-bg: #161a23;
            --accent: #ffd700;
            --text-main: #ffffff;
            --text-muted: #888;
            --border: #2a2f3a;
            --win: #2ecc71;
            --lose: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
            user-select: none;
            overflow: hidden;
        }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: var(--panel-bg);
            border-bottom: 2px solid var(--accent); z-index: 100;
        }
        .balance { font-size: 18px; font-weight: bold; color: var(--accent); }

        .main-content { flex: 1; overflow-y: auto; padding: 10px; }
        .content-section { display: none; }
        .content-section.active { display: flex; flex-direction: column; height: 100%; }

        /* --- АПГРЕЙДЕР --- */
        .upgrader-layout { display: flex; flex-direction: column; height: 100%; }
        
        .circle-zone {
            display: flex; justify-content: center; align-items: center;
            position: relative; margin: 10px 0; height: 200px;
        }
        
        .arrow-wrapper {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 180px; height: 180px; z-index: 10; pointer-events: none;
            display: flex; justify-content: center;
        }
        .arrow-pointer {
            font-size: 30px; color: var(--accent);
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 1));
            transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .wheel {
            width: 180px; height: 180px; border-radius: 50%;
            background: conic-gradient(var(--accent) 0deg, var(--accent) 0deg, #222 0deg);
            display: flex; align-items: center; justify-content: center;
            border: 4px solid #333;
        }
        .wheel-inner {
            width: 150px; height: 150px; border-radius: 50%;
            background: var(--bg-color); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            border: 2px solid var(--border);
        }
        .chance-text { font-size: 28px; font-weight: bold; color: var(--accent); }
        .chance-label { font-size: 12px; color: var(--text-muted); }

        .up-panels { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .up-panel {
            flex: 1; background: var(--panel-bg); border-radius: 12px; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid var(--border); text-align: center;
            position: relative; min-height: 130px; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .up-panel:hover { border-color: var(--accent); }
        .up-panel-title { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; width: 100%; position: absolute; top: 10px; left: 0; }
        
        .skin-img { width: 100%; height: 50px; object-fit: contain; margin-top: 15px; margin-bottom: 5px; }
        .item-name { font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .item-price { font-size: 13px; color: var(--accent); font-weight: bold; }

        .quick-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; width: 100%; }
        .quick-btn {
            background: #222; color: #fff; border: 1px solid #444; padding: 6px;
            border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold;
        }
        .quick-btn:hover { background: var(--accent); color: #000; }

        .btn-upgrade {
            background: var(--accent); color: #000; border: none; padding: 15px;
            font-size: 18px; font-weight: 900; border-radius: 10px; cursor: pointer;
            text-transform: uppercase; width: 100%; transition: all 0.2s; margin-top: 10px;
        }
        .btn-upgrade:hover { background: #ffea00; }

        .result {
            margin-top: 10px; padding: 10px; border-radius: 8px; text-align: center;
            font-weight: bold; display: none; font-size: 14px; width: 100%;
        }
        .result.win { background: rgba(46, 204, 113, 0.1); border: 1px solid var(--win); color: var(--win); }
        .result.lose { background: rgba(231, 76, 60, 0.1); border: 1px solid var(--lose); color: var(--lose); }

        /* --- МАГАЗИН --- */
        .shop-controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .shop-controls input, .shop-controls select {
            flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--panel-bg); color: #fff; outline: none; font-size: 14px;
        }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding-bottom: 20px; }
        .shop-item { background: var(--panel-bg); border-radius: 10px; padding: 10px; border: 1px solid var(--border); text-align: center; display: flex; flex-direction: column; }
        .shop-item .skin-img { height: 60px; margin-top: 0; }
        .btn-buy { background: var(--accent); color: #000; border: none; padding: 6px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; font-size: 12px; }

        /* --- МОДАЛЬНЫЕ ОКНА --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--panel-bg); width: 100%; max-width: 400px; border-radius: 16px;
            padding: 20px; border: 1px solid var(--border); text-align: center;
            max-height: 80vh; display: flex; flex-direction: column;
        }
        .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: var(--accent); }
        .modal-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px; overflow-y: auto; padding-right: 5px; max-height: 50vh;
        }
        .modal-item {
            background: #1e232e; border-radius: 8px; padding: 5px; cursor: pointer;
            border: 1px solid var(--border); transition: 0.2s; position: relative;
        }
        .modal-item:hover { border-color: var(--accent); }
        .modal-item.selected { border: 2px solid var(--accent); background: #2a2f3a; }
        .modal-item .skin-img { height: 40px; margin-top: 0; }
        
        .close-btn { background: #e74c3c; color: #fff; border: none; padding: 10px; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; width: 100%; }

        /* Количество */
        .qty-control { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 20px 0; }
        .qty-btn { background: #333; color: #fff; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer; }
        .qty-val { font-size: 24px; font-weight: bold; color: var(--accent); }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--panel-bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; font-size: 10px; gap: 4px; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--win); color: #fff; padding: 10px 20px; border-radius: 8px;
            font-weight: bold; z-index: 2000; display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-weight: bold; font-size: 16px;">CS2 UPGRADER</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="balance" id="balanceDisplay">0 ₽</div>
            <button id="adminBtn" onclick="addMoney()" style="display:none; background: var(--accent); color: #000; border: none; width: 30px; height: 30px; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; justify-content: center; align-items: center;">+</button>
        </div>
    </div>

    <div class="toast" id="toast">Успешно!</div>

    <div class="main-content">
        <div id="section-upgrader" class="content-section active">
            <div class="upgrader-layout">
                <div class="circle-zone">
                    <div class="wheel" id="wheel">
                        <div class="wheel-inner">
                            <div class="chance-text" id="chanceText">0%</div>
                            <div class="chance-label">Шанс</div>
                        </div>
                    </div>
                    <div class="arrow-wrapper">
                        <div class="arrow-pointer" id="arrow">▼</div>
                    </div>
                </div>

                <div class="up-panels">
                    <div class="up-panel" onclick="openSelectModal('left')">
                        <div class="up-panel-title">ВАША СТАВКА (Нажмите)</div>
                        <img src="" id="leftImg" class="skin-img" style="display:none;">
                        <div id="leftEmpty" style="color:var(--text-muted); font-size:30px;">📦</div>
                        <div class="item-name" id="leftName">Выбрать скины</div>
                        <div class="item-price" id="leftPrice"></div>
                    </div>
                    <div style="display: flex; align-items: center; color: var(--text-muted);">→</div>
                    <div class="up-panel" onclick="openSelectModal('right')">
                        <div class="up-panel-title">ЦЕЛЬ (Нажмите)</div>
                        <img src="" id="rightImg" class="skin-img">
                        <div class="item-name" id="rightName"></div>
                        <div class="item-price" id="rightPrice"></div>
                    </div>
                </div>

                <div class="quick-btns">
                    <button class="quick-btn" onclick="setQuickTarget('x2')">x2</button>
                    <button class="quick-btn" onclick="setQuickTarget('x4')">x4</button>
                    <button class="quick-btn" onclick="setQuickTarget('x8')">x8</button>
                    <button class="quick-btn" onclick="setQuickTarget('35')">35%</button>
                    <button class="quick-btn" onclick="setQuickTarget('55')">55%</button>
                    <button class="quick-btn" onclick="setQuickTarget('75')">75%</button>
                </div>

                <button class="btn-upgrade" id="upgradeBtn">УЛУЧШИТЬ</button>
                <div class="result" id="resultBox"></div>
            </div>
        </div>

        <div id="section-shop" class="content-section">
            <div class="shop-controls">
                <input type="text" id="searchInput" placeholder="Поиск..." oninput="renderShop()">
                <select id="sortSelect" onchange="renderShop()">
                    <option value="asc">Дешевле</option>
                    <option value="desc">Дороже</option>
                </select>
            </div>
            <div class="shop-grid" id="shopGrid"></div>
        </div>

        <div id="section-inv" class="content-section">
            <h2 style="text-align:center; margin-bottom:10px; font-size:16px; color:var(--text-muted);">МОЙ ИНВЕНТАРЬ</h2>
            <div class="shop-grid" id="invGridFull"></div>
        </div>
    </div>

    <div class="modal" id="selectModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Выберите скин</div>
            <div class="modal-grid" id="modalGrid"></div>
            <button class="close-btn" onclick="closeModal('selectModal')">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="buyModal">
        <div class="modal-content" style="max-width: 300px;">
            <div class="modal-title">Покупка</div>
            <img src="" id="buyImg" style="width:100px; height:80px; object-fit:contain; margin:0 auto;">
            <div style="font-weight:bold; margin-top:10px;" id="buyName"></div>
            <div style="color:var(--accent); font-weight:bold; font-size:18px; margin-top:5px;" id="buyPrice"></div>
            
            <div class="qty-control">
                <button class="qty-btn" onclick="changeQty(-1)">-</button>
                <div class="qty-val" id="buyQty">1</div>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Итого: <span id="buyTotal" style="color:#fff;">0</span> ₽</div>
            
            <button class="btn-buy" style="padding:12px; font-size:16px;" onclick="confirmBuy()">Оплатить</button>
            <button class="close-btn" onclick="closeModal('buyModal')">Отмена</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('section-upgrader', this)">
            <div class="nav-icon">⚡</div><div>Апгрейд</div>
        </div>
        <div class="nav-item" onclick="switchTab('section-shop', this)">
            <div class="nav-icon">🛒</div><div>Магазин</div>
        </div>
        <div class="nav-item" onclick="switchTab('section-inv', this)">
            <div class="nav-icon">🎒</div><div>Инвентарь</div>
        </div>
    </div>

            { id: '42', name: 'M4A4 | Poseidon', price: 9000, img: baseImg + 'm4a4_poseidon.png' },
            { id: '43', name: 'AWP | Dragon Lore', price: 10000, img: baseImg + 'awp_dragon_lore.png' },
            { id: '44', name: 'M4A4 | Howl', price: 12000, img: baseImg + 'm4a4_howl.png' },
            { id: '45', name: 'AWP | Gungnir', price: 15000, img: baseImg + 'awp_gungnir.png' },
            { id: '46', name: 'AK-47 | Wild Lotus', price: 18000, img: baseImg + 'ak47_wild_lotus.png' },
            { id: '47', name: 'AWP | The Prince', price: 20000, img: baseImg + 'awp_the_prince.png' },
            { id: '48', name: '★ Karambit | Doppler', price: 25000, img: baseImg + 'knife_karambit_doppler.png' },
            { id: '49', name: '★ Butterfly Knife | Fade', price: 30000, img: baseImg + 'knife_butterfly_fade.png' },
            { id: '50', name: '★ M9 Bayonet | Crimson Web', price: 35000, img: baseImg + 'knife_m9_bayonet_crimson_web.png' }
        ];

        const STORAGE_KEY = 'cs_upgrader_v13';
        let state = loadState();
        let selectedLeft = [];
        let selectedRight = ITEMS[16]; 
        let upgradeCounter = 0; 
        
        let currentBuyItem = null;
        let currentBuyQty = 1;

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            let currentState = { balance: 1000, inventory: [], bestDrop: 0, upgradesCount: 0 };
            
            if (saved) { try { currentState = JSON.parse(saved); } catch (e) {} }
            
            if (currentState.balance < 10) {
                currentState.balance += 400;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(currentState));
                setTimeout(() => {
                    if (typeof showToast === 'function') showToast("Вам начислено 400 ₽ (бонус)!");
                }, 500);
            }
            
            return currentState;
        }

        function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        
        function updateUI() {
            document.getElementById('balanceDisplay').textContent = state.balance.toLocaleString() + ' ₽';
        }
        
        function showToast(text) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        // Проверка ID при загрузке
        window.addEventListener('load', () => {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                if (tg.initDataUnsafe.user.id === ADMIN_ID) {
                    document.getElementById('adminBtn').style.display = 'flex';
                }
            }
        });

        window.addMoney = function() {
            const amount = prompt("Сколько денег добавить на баланс?", "10000");
            if (amount !== null && !isNaN(amount) && Number(amount) > 0) {
                state.balance += Number(amount);
                saveState();
                updateUI();
                showToast(`Баланс пополнен на ${Number(amount).toLocaleString()} ₽`);
            }
        }

        window.switchTab = function(tabId, el) {
            document.querySelectorAll('.content-section').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
            if (tabId === 'section-shop') renderShop();
            if (tabId === 'section-inv') renderInv();
        }

        window.renderShop = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            const grid = document.getElementById('shopGrid');
            
            let filtered = ITEMS.filter(i => i.name.toLowerCase().includes(query));
            if (sort === 'asc') filtered.sort((a, b) => a.price - b.price);
            else if (sort === 'desc') filtered.sort((a, b) => b.price - a.price);
            
            grid.innerHTML = filtered.map(item => `
                <div class="shop-item">
                    <img src="${item.img}" class="skin-img" loading="lazy">
                    <div class="item-name" title="${item.name}">${item.name}</div>
                    <div class="item-price">${item.price.toLocaleString()} ₽</div>
                    <button class="btn-buy" onclick="openBuyModal('${item.id}')">Купить</button>
                </div>
            `).join('');
        }

        window.openBuyModal = function(id) {
            currentBuyItem = ITEMS.find(i => i.id === id);
            currentBuyQty = 1;
            document.getElementById('buyImg').src = currentBuyItem.img;
            document.getElementById('buyName').textContent = currentBuyItem.name;
            document.getElementById('buyPrice').textContent = currentBuyItem.price.toLocaleString() + ' ₽';
            document.getElementById('buyQty').textContent = currentBuyQty;
            updateBuyTotal();
            document.getElementById('buyModal').classList.add('active');
        }

        window.changeQty = function(amount) {
            currentBuyQty += amount;
            if (currentBuyQty < 1) currentBuyQty = 1;
            document.getElementById('buyQty').textContent = currentBuyQty;
            updateBuyTotal();
        }

        function updateBuyTotal() {
            document.getElementById('buyTotal').textContent = (currentBuyItem.price * currentBuyQty).toLocaleString();
        }

        window.confirmBuy = function() {
            const totalPrice = currentBuyItem.price * currentBuyQty;
            if (state.balance < totalPrice) return alert('Недостаточно средств!');
            
            state.balance -= totalPrice;
            for(let i=0; i<currentBuyQty; i++) {
                state.inventory.push(currentBuyItem);
            }
            saveState();
            updateUI();
            closeModal('buyModal');
            showToast(`Успешно куплено: ${currentBuyItem.name} (x${currentBuyQty})`);
        }

        function renderInv() {
            const grid = document.getElementById('invGridFull');
            if (state.inventory.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:var(--text-muted);">Пусто</div>';
                return;
            }
            grid.innerHTML = state.inventory.map((item, index) => `
                <div class="shop-item">
                    <img src="${item.img}" class="skin-img" loading="lazy">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price} ₽</div>
                </div>
            `).join('');
        }

        let modalMode = 'left'; 
        
        window.openSelectModal = function(mode) {
            modalMode = mode;
            const grid = document.getElementById('modalGrid');
            document.getElementById('modalTitle').textContent = mode === 'left' ? 'Ваша ставка (можно несколько)' : 'Выберите цель';
            
            if (mode === 'left') {
                if (state.inventory.length === 0) {
                    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#888;">Инвентарь пуст. Купите скины в магазине.</div>';
                } else {
                    grid.innerHTML = state.inventory.map((item, index) => {
                        const isSelected = selectedLeft.some(i => i.index === index);
                        return `
                        <div class="modal-item ${isSelected ? 'selected' : ''}" onclick="toggleLeftItem(${index})">
                            <img src="${item.img}" class="skin-img">
                            <div class="item-name">${item.name.split('|')[0]}</div>
                            <div class="item-price">${item.price} ₽</div>
                        </div>`;
                    }).join('');
                }
            } else {
                grid.innerHTML = ITEMS.map(item => `
                    <div class="modal-item" onclick="setRightItem('${item.id}')">
                        <img src="${item.img}" class="skin-img">
                        <div class="item-name">${item.name.split('|')[0]}</div>
                        <div class="item-price">${item.price} ₽</div>
                    </div>
                `).join('');
            }
            document.getElementById('selectModal').classList.add('active');
        }

        window.closeModal = function(id) {
            document.getElementById(id).classList.remove('active');
        }

        window.toggleLeftItem = function(index) {
            const item = state.inventory[index];
            const existingIdx = selectedLeft.findIndex(i => i.index === index);
            
            if (existingIdx > -1) {
                selectedLeft.splice(existingIdx, 1);
            } else {
                selectedLeft.push({ ...item, index });
            }
            openSelectModal('left');
            updateLeftPanel();
        }

        window.setRightItem = function(id) {
            selectedRight = ITEMS.find(i => i.id === id);
            updateRightPanel();
            closeModal('selectModal');
        }

        function updateLeftPanel() {
            const img = document.getElementById('leftImg');
            const empty = document.getElementById('leftEmpty');
            const name = document.getElementById('leftName');
            const price = document.getElementById('leftPrice');
            
            if (selectedLeft.length === 0) {
                img.style.display = 'none'; empty.style.display = 'block';
                name.textContent = 'Выбрать скины'; price.textContent = '';
            } else if (selectedLeft.length === 1) {
                img.style.display = 'block'; empty.style.display = 'none';
                img.src = selectedLeft[0].img;
                name.textContent = selectedLeft[0].name;
                price.textContent = selectedLeft[0].price.toLocaleString() + ' ₽';
            } else {
                img.style.display = 'none'; empty.style.display = 'block';
                empty.textContent = '📦';
                const total = selectedLeft.reduce((sum, item) => sum + item.price, 0);
                name.textContent = `Выбрано: ${selectedLeft.length} шт.`;
                price.textContent = total.toLocaleString() + ' ₽';
            }
            updateChanceUI();
        }

        function updateRightPanel() {
            document.getElementById('rightImg').src = selectedRight.img;
            document.getElementById('rightName').textContent = selectedRight.name;
            document.getElementById('rightPrice').textContent = selectedRight.price.toLocaleString() + ' ₽';
            updateChanceUI();
        }

        function updateChanceUI() {
            const totalLeftPrice = selectedLeft.reduce((sum, item) => sum + item.price, 0);
            if (totalLeftPrice === 0) {
                document.getElementById('chanceText').textContent = '0%';
                document.getElementById('wheel').style.background = `conic-gradient(var(--accent) 0deg, #222 0deg)`;
                return;
            }
            let chance = totalLeftPrice / selectedRight.price;
            if (chance > 1) chance = 1;
            const percent = (chance * 100).toFixed(1);
            document.getElementById('chanceText').textContent = percent + '%';
            document.getElementById('wheel').style.background = `conic-gradient(var(--accent) ${chance * 360}deg, #222 ${chance * 360}deg)`;
        }

        window.setQuickTarget = function(mode) {
            const totalLeftPrice = selectedLeft.reduce((sum, item) => sum + item.price, 0);
            if (totalLeftPrice === 0) return alert('Выберите скины для ставки!');
            
            let targetPrice;
            if (mode === 'x2') targetPrice = totalLeftPrice * 2;
            else if (mode === 'x4') targetPrice = totalLeftPrice * 4;
            else if (mode === 'x8') targetPrice = totalLeftPrice * 8;
            else if (mode === '35') targetPrice = totalLeftPrice / 0.35;
            else if (mode === '55') targetPrice = totalLeftPrice / 0.55;
            else if (mode === '75') targetPrice = totalLeftPrice / 0.75;

            let closest = ITEMS[0];
            let minDiff = Infinity;
            for (let item of ITEMS) {
                const diff = Math.abs(item.price - targetPrice);
                if (diff < minDiff) { minDiff = diff; closest = item; }
            }
            setRightItem(closest.id);
        }

        document.getElementById('upgradeBtn').addEventListener('click', () => {
            const totalLeftPrice = selectedLeft.reduce((sum, item) => sum + item.price, 0);
            if (totalLeftPrice === 0) return alert('Выберите скины из инвентаря!');
            if (totalLeftPrice >= selectedRight.price) return alert('Ставка должна быть меньше цели!');

            const chance = totalLeftPrice / selectedRight.price;
            let targetToWin = selectedRight;
            
            upgradeCounter++;
            let secretDrop = false;
            if (upgradeCounter >= 15) {
                upgradeCounter = 0;
                if (Math.random() < 0.3) {
                    secretDrop = true;
                    targetToWin = ITEMS[43];
                    if (totalLeftPrice > 5000) targetToWin = ITEMS[47];
                }
            }

            const indicesToRemove = selectedLeft.map(i => i.index).sort((a,b) => b-a);
            indicesToRemove.forEach(idx => state.inventory.splice(idx, 1));

            const arrow = document.getElementById('arrow');
            const win = secretDrop || (Math.random() < chance);
            
            let targetDeg;
            if (win) {
                targetDeg = 360 * 5; 
            } else {
                const grayStart = chance * 360;
                const randomPos = grayStart + Math.random() * (360 - grayStart);
                targetDeg = 360 * 5 + randomPos;
            }

            arrow.style.transform = `rotate(${targetDeg}deg)`;

            document.getElementById('upgradeBtn').disabled = true;
            document.getElementById('resultBox').style.display = 'none';

            setTimeout(() => {
                const box = document.getElementById('resultBox');
                if (win) {
                    state.inventory.push(targetToWin);
                    state.upgradesCount++;
                    if (targetToWin.price > state.bestDrop) state.bestDrop = targetToWin.price;
                    box.className = 'result win';
                    box.textContent = `🎉 Выигрыш! ${targetToWin.name}`;
                } else {
                    state.upgradesCount++;
                    box.className = 'result lose';
                    box.textContent = `💀 Не повезло. Скины сгорели.`;
                }
                box.style.display = 'block';
                
                saveState();
                updateUI();
                renderInv();
                
                selectedLeft = [];
                updateLeftPanel();
                
                setTimeout(() => {
                    arrow.style.transition = 'none';
                    arrow.style.transform = 'rotate(0deg)';
                    setTimeout(() => arrow.style.transition = 'transform 3s cubic-bezier(0.1, 0.7, 0.1, 1);', 50);
                }, 1000);

                document.getElementById('upgradeBtn').disabled = false;
            }, 3000);
        });

        updateUI();
        setRightItem('17');
        renderShop();
        renderInv();
    </script>
</body>
</html>
